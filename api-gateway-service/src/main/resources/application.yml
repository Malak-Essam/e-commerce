spring:
  application:
    name: api-gateway-service

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**
        - id: cart-service
          uri: lb://cart-service
          predicates:
            - Path=/api/carts/**
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**

server:
  port: 8080

eureka:
  instance:
    hostname: ${INSTANCE_HOSTNAME:localhost}
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true

spring:
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest

  cloud:
    stream:
      rabbit:
        default:
          consumer:
            auto-bind-dlq: true
            republish-to-dlq: true
          producer:
            auto-bind-dlq: true
      bindings:
        orderCreated-out-0:
          destination: order.events
        orderConfirmed-out-0:
          destination: order.events
        orderFailed-out-0:
          destination: order.events
        paymentProcessed-out-0:
          destination: payment.events
        inventoryReserved-out-0:
          destination: inventory.events
        inventoryReservationFailed-out-0:
          destination: inventory.events

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.ecommerce.gateway: DEBUG
