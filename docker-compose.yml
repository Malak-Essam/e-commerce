services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - ecommerce-network

  eureka-server-service:
    build:
      context: .
      dockerfile: eureka-server-service/Dockerfile
    ports:
      - "8761:8761"
    environment:
      INSTANCE_HOSTNAME: eureka-server-service
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ecommerce-network

  api-gateway-service:
    build:
      context: .
      dockerfile: api-gateway-service/Dockerfile
    ports:
      - "8080:8080"
    environment:
      EUREKA_URI: http://eureka-server-service:8761/eureka/
      INSTANCE_HOSTNAME: api-gateway-service
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      eureka-server-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ecommerce-network

  user-service:
