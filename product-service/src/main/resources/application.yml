spring:
  application:
    name: product-service

  datasource:
    url: jdbc:h2:mem:productdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

server:
  port: 8082

spring:
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest

  cloud:
    stream:
      rabbit:
        default:
          consumer:
            auto-bind-dlq: true
            republish-to-dlq: true
          producer:
            auto-bind-dlq: true
      bindings:
        orderCreated-out-0:
          destination: order.events
        orderConfirmed-out-0:
          destination: order.events
        orderFailed-out-0:
          destination: order.events
        paymentProcessed-out-0:
          destination: payment.events
        inventoryReserved-out-0:
          destination: inventory.events
        inventoryReservationFailed-out-0:
          destination: inventory.events

management:
  endpoints:
    web:
      exposure:
        include: health

eureka:
  instance:
    hostname: ${INSTANCE_HOSTNAME:localhost}
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
